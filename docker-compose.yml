version: "3.8" # Sử dụng phiên bản Docker Compose mới nhất

services:
  # Service cho Backend
  backend:
    build:
      context: ./backend # Đường dẫn đến thư mục chứa Dockerfile của backend
      dockerfile: Dockerfile
    ports:
      - "8888:8888" # Map port 8888 của host tới port 8888 của container
    environment:
      # Các biến môi trường cho backend, có thể đặt ở đây hoặc trong Dockerfile
      # Những biến trong Dockerfile đã là mặc định, ở đây nếu muốn ghi đè
      - BATTLESHIP_HOST=0.0.0.0
      - BATTLESHIP_PORT=8888
      - BATTLESHIP_ENV=production
      - BATTLESHIP_LOG_LEVEL=INFO
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.socket(); s.connect(('localhost', 8888)); s.close()",
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped # Tự động khởi động lại container nếu bị dừng
    # volumes:
    # Tùy chọn: Nếu bạn muốn thay đổi mã nguồn backend mà không cần build lại image
    # - ./backend:/app
    # - /app/requirements.txt # Để tránh overwrite file này nếu đã copy vào image

  # Service cho Frontend
  frontend:
    build:
      context: ./frontend/battleship-frontend # Đường dẫn đến thư mục chứa Dockerfile của frontend
      dockerfile: Dockerfile
    ports:
      - "80:80" # Map port 80 của host tới port 80 của container (HTTP mặc định)
    depends_on:
      - backend # Đảm bảo backend được khởi động trước frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped # Tự động khởi động lại container nếu bị dừng
