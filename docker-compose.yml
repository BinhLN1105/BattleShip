version: "3.8"

services:
  # Service cho Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: battleship_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battleship_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-battleship}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-battleship}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Service cho Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: battleship_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${BATTLESHIP_PORT:-8888}:8888"
    environment:
      - BATTLESHIP_HOST=0.0.0.0
      - BATTLESHIP_PORT=8888
      - BATTLESHIP_ENV=production
      - BATTLESHIP_LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-battleship_secret_pass}
      - POSTGRES_DB=${POSTGRES_DB:-battleship}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.socket(); s.connect(('localhost', 8888)); s.close()",
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  # Service cho Frontend
  frontend:
    build:
      context: ./frontend/battleship-frontend
      dockerfile: Dockerfile
    container_name: battleship_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
