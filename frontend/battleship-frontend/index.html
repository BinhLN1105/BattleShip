<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battleship War - Hải Chiến Chiến Thuật</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <script>
    // Global Anti-Cheat: Chặn F12, DevTools shortcuts, View Source và chuột phải
    (function() {
      function blockEvent(e) {
        // F12
        if (e.key === 'F12' || e.code === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // Ctrl+Shift+I / J / C (DevTools)
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // Ctrl+U (View Source), Ctrl+S (Save Page)
        if ((e.ctrlKey || e.metaKey) && ['U', 'u', 'S', 's'].includes(e.key)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
        // Shift+F10 (Context Menu)
        if (e.shiftKey && (e.key === 'F10' || e.code === 'F10' || e.keyCode === 121)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }

      function blockContextMenu(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      window.addEventListener('keydown', blockEvent, true);
      document.addEventListener('keydown', blockEvent, true);
      window.addEventListener('contextmenu', blockContextMenu, true);
      document.addEventListener('contextmenu', blockContextMenu, true);
      document.oncontextmenu = function() { return false; };
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
