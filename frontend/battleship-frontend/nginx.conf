# frontend/nginx.conf
server {
    listen 80;
    server_name localhost;

    # Cấu hình để phục vụ các tệp tĩnh của ứng dụng frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API hiện có cho các yêu cầu HTTP
    location /api/ {
        proxy_pass http://backend:8888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # THÊM MỚI: Cấu hình proxy WebSocket
    # Frontend sẽ kết nối tới ws://<IP_hoặc_domain_của_Nginx>/ws/
   location /ws/ {
       proxy_pass http://backend:8888/ws/;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection "upgrade";
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
   }
}